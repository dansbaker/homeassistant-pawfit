name: Validate Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        requirements: [requirements_test.txt, requirements_test_2026_10.txt]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}
      - name: Install test dependencies
        run: python -m pip install -r "${{ matrix.requirements }}"
      - name: Lint
        run: |
          ruff check custom_components tests
          ruff format --check custom_components tests
      - name: Test with branch coverage
        run: >-
          python -m pytest -q --cov=custom_components.pawfit --cov-branch
          --cov-report=term-missing --cov-report=xml --cov-fail-under=95
      - name: Validate metadata and translations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('custom_components/pawfit')
          manifest = json.loads((root / 'manifest.json').read_text())
          assert manifest['domain'] == 'pawfit'
          assert manifest['codeowners'] == ['@dansbaker']
          assert manifest['config_flow']
          hacs = json.loads(Path('hacs.json').read_text())
          assert hacs['zip_release'] and hacs['filename'] == 'pawfit.zip'
          assert json.loads((root / 'strings.json').read_text()) == json.loads((root / 'translations/en.json').read_text())
          PY

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

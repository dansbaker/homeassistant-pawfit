name: Create Release

on:
  push:
    tags: ['v*']

jobs:
  validate:
    permissions:
      contents: read
    uses: ./.github/workflows/validate.yml

  release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and prepare HACS archive
        id: prepare
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          root = Path('custom_components/pawfit')
          version = json.loads((root / 'manifest.json').read_text())['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Tag must match manifest version'
          notes = Path('docs/releases') / f'{version}.md'
          assert notes.is_file(), 'Credited release notes are required'
          with ZipFile('pawfit.zip', 'w', ZIP_DEFLATED) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file() and '__pycache__' not in path.parts and path.suffix != '.pyc':
                      archive.write(path, path.relative_to(root))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)
              print(f'notes={notes}', file=output)
          PY
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: pawfit.zip
          fail_on_unmatched_files: true
          name: "Version ${{ steps.prepare.outputs.version }}"
          body_path: ${{ steps.prepare.outputs.notes }}
          draft: false
          prerelease: false
